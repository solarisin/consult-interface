[project]
name = "consult-interface"
version = "0.2.0"
description = "Host-side implementation of the Nissan CONSULT diagnostic protocol"
authors = [{ name = "Rob L.", email = "solarisin@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5,<4.0",
    "click>=8.1.7,<9.0",
]

[project.scripts]
cli = "consult_interface.cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9.0",
    "pytest-html>=4.1.1,<5.0",
    "matplotlib>=3.9.2,<4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consult_interface"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["concept", "mock_ecu", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/consult_interface"]
exclude = ["concept", "mock_ecu"]

[tool.pytest.ini_options]
testpaths = "tests"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S.%f"
log_level = "DEBUG"
log_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S.%f"
