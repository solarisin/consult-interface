# Nissan CONSULT ECU parameter table.
#
# Generated once from the original hardcoded table. Values are authoritative
# here now -- docs/params.csv is human reference material and is NOT loaded.
# Rows carrying `disputed` conflict with params.csv and are deliberately
# left at the code's original value pending confirmation on a real ECU.

schema_version = 1

[[param]]
id = "ENGINE_SPEED_HR"
kind = "dual"
name = "Engine Speed HR"
register_msb = 0x00
register_lsb = 0x01
unit = "RPM"
scale = 12.5

[[param]]
id = "ENGINE_SPEED_LR"
kind = "dual"
name = "Engine Speed LR"
register_msb = 0x02
register_lsb = 0x03
unit = "RPM"
scale = 8

[[param]]
id = "MAF_VOLTAGE"
kind = "dual"
name = "MAF Voltage"
register_msb = 0x04
register_lsb = 0x05
unit = "mV"
scale = 5

[[param]]
id = "MAF_VOLTAGE_RH"
kind = "dual"
name = "MAF Voltage RH"
register_msb = 0x06
register_lsb = 0x07
unit = "mV"
scale = 5

[[param]]
id = "COOLANT_TEMP"
kind = "single"
name = "Coolant Temp"
register = 0x08
unit = "C"
offset = -50

[[param]]
id = "O2_VOLTAGE_LH"
kind = "single"
name = "O2 Voltage LH"
register = 0x09
unit = "mV"
scale = 10

[[param]]
id = "O2_VOLTAGE_RH"
kind = "single"
name = "O2 Voltage RH"
register = 0x0A
unit = "mV"
scale = 10

[[param]]
id = "VEHICLE_SPEED"
kind = "single"
name = "Vehicle Speed"
register = 0x0B
unit = "km/h"
scale = 2
disputed = "params.csv says Value * 2 (kph); km/h vs kph is cosmetic"

[[param]]
id = "BATTERY_VOLTAGE"
kind = "single"
name = "Battery Voltage"
register = 0x0C
unit = "V"
scale = 80
disputed = "params.csv says Value * 80 (mV); the V label is likely wrong"

[[param]]
id = "TPS"
kind = "single"
name = "TPS"
register = 0x0D
unit = "%"
scale = 20
disputed = "params.csv says Value * 20 (mV); code labels it % -- genuine conflict"

